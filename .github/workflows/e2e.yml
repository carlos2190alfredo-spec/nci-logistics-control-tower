name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nci
          POSTGRES_PASSWORD: nci_local_password
          POSTGRES_DB: nci_logistics
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nci -d nci_logistics"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      minio:
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        env:
          MINIO_ROOT_USER: nci_minio
          MINIO_ROOT_PASSWORD: nci_minio_password
        ports:
          - 9000:9000
        options: --entrypoint /bin/sh
        # Note: server command must be started manually below since services don't accept args here.

      mailpit:
        image: axllent/mailpit:v1.27.8
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DATABASE_URL: postgresql://nci:nci_local_password@localhost:5433/nci_logistics?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SESSION_SECRET: ci-e2e-session-secret-not-for-production-use-only-workflow-test
      SESSION_COOKIE_NAME: nci_lct_session
      MFA_ENCRYPTION_KEY: 1beb5803a9c9dccf7325297d74553b38fa072d1474c33ccabc99cca4bce2d7c8
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: nci_minio
      MINIO_SECRET_KEY: nci_minio_password
      MINIO_BUCKET: nci-logistics-ci
      MAIL_HOST: localhost
      MAIL_PORT: "1025"
      MAIL_FROM: "NCI CI <no-reply@ci.local>"
      AI_PROVIDER: disabled
      GOOGLE_MAPS_ROUTES_MODE: disabled

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Prisma migrate & seed
        run: |
          pnpm prisma generate
          pnpm prisma migrate deploy
          pnpm db:seed

      - name: Initialize storage bucket
        run: pnpm storage:init

      - name: Build
        run: pnpm build

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
