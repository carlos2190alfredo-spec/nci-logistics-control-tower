name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nci
          POSTGRES_PASSWORD: nci_local_password
          POSTGRES_DB: nci_logistics
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nci -d nci_logistics"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nci:nci_local_password@localhost:5433/nci_logistics?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SESSION_SECRET: ci-session-secret-not-for-production-use-only-ci-workflow-test
      SESSION_COOKIE_NAME: nci_lct_session
      MFA_ENCRYPTION_KEY: 1beb5803a9c9dccf7325297d74553b38fa072d1474c33ccabc99cca4bce2d7c8
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: nci_minio
      MINIO_SECRET_KEY: nci_minio_password
      MINIO_BUCKET: nci-logistics-ci
      MAIL_HOST: localhost
      MAIL_PORT: "1025"
      MAIL_FROM: "NCI CI <no-reply@ci.local>"
      AI_PROVIDER: disabled
      GOOGLE_MAPS_ROUTES_MODE: disabled
      COMMIT_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma generate

      - name: Prisma migrate deploy
        run: pnpm prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Security check
        run: pnpm security:check

      - name: Build
        run: pnpm build

  security-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # `pnpm install` ejecuta `prisma generate` (postinstall), y prisma.config.ts exige DATABASE_URL.
      # Solo se genera el cliente: no se abre ninguna conexión.
      DATABASE_URL: postgresql://nci:nci_local_password@localhost:5433/nci_logistics?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod || true
